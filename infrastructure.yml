AWSTemplateFormatVersion: '2010-09-09'
Description: Creates the EC2 instance, IAM role, and security group for the calculator app.

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Description: The latest Amazon Linux 2 AMI.
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

Resources:
  # 1. The IAM Role for the EC2 Instance
  EC2InstanceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        # This policy allows the EC2 agent to pull the deployment from S3
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'

  # 2. The Instance Profile to attach the role
  EC2InstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # 3. The Security Group (firewall)
  WebServerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow SSH'
      SecurityGroupIngress:
        # Allow SSH (Port 22) from any IP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # 4. The EC2 Instance ("Web Server")
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      
      # This is the critical tag CodeDeploy uses to find the instance
      Tags:
        - Key: App
          Value: Calculator
      
      # This script runs on first boot to install our software
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Update and install Java 11
          yum update -y
          amazon-linux-extras install java-openjdk11 -y
          
          # Install the CodeDeploy Agent
          yum install -y ruby wget
          cd /home/ec2-user
          wget https://aws-codedeploy-us-east-1.s3.us-east-1.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          service codedeploy-agent start
